[package]
name = "bpm-vm-contract"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5.0"
cw-storage-plus = "1.2.0"
schemars = "0.8.15"
serde = { version = "1.0.189", default-features = false, features = ["derive"] }
thiserror = "1.0.49"

[dev-dependencies]
# cw-orchestrator 대신 2026년 표준인 cw-orch를 사용합니다.
cw-orch = "0.22.1" 
tokio = { version = "1.32.0", features = ["full"] }